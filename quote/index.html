<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>悅聲報價單</title>
<style>
:root{--bg:#f2f4f7;--panel:#fff;--fg:#1d2733;--muted:#5a6675;--line:#b8c3cf;--accent:#2f6db5;--accent-ink:#245a98;--accent-soft:#e9f1fb;--danger:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid #e0e5eb;border-radius:14px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font-size:22px;font-weight:700}
h1 span{color:var(--muted);font-weight:500;font-size:16px;margin-left:8px}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.remember{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px;cursor:pointer}
.remember input{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;font-size:17px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{background:var(--accent-ink)}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--danger);font-size:14px;min-height:1.4em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>悅聲<span>報價單</span></h1>
  <p>內部使用，請輸入密碼。</p>
  <label for="pw">密碼<input type="password" id="pw" required autofocus></label>
  <label class="remember" for="rm"><input type="checkbox" id="rm" checked> 這台裝置記住密碼</label>
  <button type="submit" id="go">開啟</button>
  <div class="err" id="err" role="alert"></div>
</form>
